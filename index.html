<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>enjoy page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 폰트 추가 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/HakgyoansimDunggeunmiso/HakgyoansimDunggeunmiso.css" type="text/css"/>
    
    <style>
        @font-face {
            font-family: 'GmarketSansMedium';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            font-family: 'GmarketSansMedium', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-logo { font-family: 'Hakgyoansim Dunggeunmiso', sans-serif; }
        .btn-hover { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-hover:active { transform: scale(0.96); }
        .scale-in { animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* 숫자 변경 애니메이션 */
        .price-up { color: #ef4444; animation: pulseRed 0.5s ease-in-out; }
        .price-down { color: #3b82f6; animation: pulseBlue 0.5s ease-in-out; }
        @keyframes pulseRed { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes pulseBlue { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col items-center justify-center p-6 bg-white">

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-xs flex flex-col gap-6 items-center animate-fade-in-up">
        
        <!-- 로고 영역 -->
        <div class="flex flex-col items-center gap-2 mb-2">
            <div class="w-20 h-20 bg-[#005ED2]/10 rounded-[2rem] flex items-center justify-center text-[#005ED2] mb-2 shadow-sm">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
            </div>
            <h1 class="font-logo text-3xl text-black tracking-tight">enjoy page</h1>
            <p class="text-gray-400 text-xs tracking-widest uppercase">Select Menu</p>
        </div>

        <!-- 👇 실시간 주가 위젯 -->
        <div class="w-full bg-white border border-gray-100 rounded-2xl p-4 shadow-sm flex items-center justify-between relative overflow-hidden h-[88px]">
            <!-- 왼쪽 정보 영역 -->
            <div class="flex items-center gap-3 z-20 shrink-0">
                <div class="w-10 h-10 rounded-full bg-sky-50 flex items-center justify-center text-sky-500 shrink-0">
                    <span class="font-bold text-xs">ENJ</span>
                </div>
                <div class="flex flex-col">
                    <div class="flex items-center gap-1">
                        <span class="text-xs text-gray-400 font-medium">실시간 엔조이 주가</span>
                        <!-- 장 마감 뱃지 (기본 숨김) -->
                        <span id="market-badge" class="hidden text-[9px] font-bold bg-gray-800 text-white px-1.5 py-0.5 rounded-full">🌙 마감</span>
                    </div>
                    <div class="flex items-end gap-1.5">
                        <!-- 가격 표시 -->
                        <span id="ticker-price" class="text-xl font-bold text-gray-800 tabular-nums">-</span>
                    </div>
                    <span id="ticker-change" class="text-[10px] font-bold text-gray-400 tabular-nums">-</span>
                </div>
            </div>

            <!-- 오른쪽 미니 차트 영역 -->
            <div class="absolute right-0 top-0 bottom-0 w-[120px] h-full z-10 opacity-80 pointer-events-none">
                 <div class="absolute inset-0 bg-gradient-to-r from-white via-transparent to-transparent z-20"></div>
                 <svg id="mini-chart" width="100%" height="100%" preserveAspectRatio="none" class="overflow-visible">
                    <!-- 차트 선 -->
                    <polyline id="chart-line" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" points=""></polyline>
                 </svg>
            </div>
        </div>

        <!-- 버튼 그룹 -->
        <div class="w-full flex flex-col gap-3">
            <!-- 음악 -->
            <button onclick="goToMusic()" class="btn-hover w-full bg-[#005ED2] text-white p-5 rounded-2xl shadow-[0_10px_20px_-5px_rgba(0,94,210,0.3)] flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    </div>
                    <div class="text-left">
                        <span class="block text-xs opacity-80 font-medium mb-0.5">Music Player</span>
                        <span class="block text-lg font-bold">음악 들으러 가기</span>
                    </div>
                </div>
                <svg class="opacity-50 group-hover:translate-x-1 transition-transform" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>

            <!-- 주식 -->
            <button onclick="checkStock()" class="btn-hover w-full bg-sky-400 text-white p-5 rounded-2xl shadow-[0_10px_20px_-5px_rgba(56,189,248,0.3)] flex items-center justify-between group relative overflow-hidden">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
                    </div>
                    <div class="text-left">
                        <div class="flex items-center gap-2">
                            <span class="block text-xs opacity-90 font-medium mb-0.5">Stock Market</span>
                            <!-- NEW 배지 -->
                            <span class="bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold animate-pulse shadow-sm border border-white/20">NEW</span>
                        </div>
                        <span class="block text-lg font-bold">엔조이 주가 확인</span>
                    </div>
                </div>
                <svg class="opacity-50 group-hover:translate-x-1 transition-transform" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>

            <!-- 게임 -->
            <button onclick="playGame()" class="btn-hover w-full bg-[#005ED2] text-white p-5 rounded-2xl shadow-[0_10px_20px_-5px_rgba(0,94,210,0.3)] flex items-center justify-between group relative overflow-hidden">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="6" y1="12" x2="18" y2="12"></line>
                            <line x1="12" y1="18" x2="12" y2="6"></line>
                            <circle cx="12" cy="12" r="10"></circle>
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="flex items-center gap-2">
                            <span class="block text-xs opacity-80 font-medium mb-0.5">Random Game</span>
                            <span class="bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold animate-pulse shadow-sm border border-white/20">NEW</span>
                        </div>
                        <span class="block text-lg font-bold">엔조이 복불복 게임</span>
                    </div>
                </div>
                <svg class="opacity-50 group-hover:translate-x-1 transition-transform" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </div>
        
        <div class="mt-8 text-center">
             <p class="text-[10px] text-gray-300">© 2024 Play Enjoy. All rights reserved.</p>
        </div>
    </div>

    <!-- 업데이트 안내 팝업 -->
    <div id="startup-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center px-6">
        <div class="bg-white rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl border border-gray-100 scale-in relative">
            <div class="w-12 h-12 bg-[#005ED2]/10 rounded-full flex items-center justify-center mx-auto mb-4 text-[#005ED2]">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-black mb-4">업데이트 안내</h3>
            <div class="space-y-3 mb-6">
                <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                    <p class="text-[#005ED2] text-sm font-bold mb-1">🎉 신규 서비스 오픈!</p>
                    <p class="text-gray-800 text-xs break-keep">
                        <span class="font-bold">엔조이 복불복 게임</span>이 출시되었습니다.<br>지금 바로 확인해보세요!
                    </p>
                </div>
                <div class="bg-sky-50 p-3 rounded-xl border border-sky-100">
                    <p class="text-sky-600 text-sm font-bold mb-1">✅ 서비스 정상화</p>
                    <p class="text-gray-600 text-xs break-keep leading-snug">
                        <span class="font-bold text-black">엔조이 주식 서비스</span>가<br>
                        재정비를 마치고 <span class="text-sky-600 font-bold">재개되었습니다.</span>
                    </p>
                </div>
            </div>
            <button onclick="closeModal('startup-modal')" class="w-full bg-[#005ED2] text-white font-bold py-3 rounded-xl hover:bg-[#004bb5] transition-colors shadow-lg shadow-[#005ED2]/30">
                확인
            </button>
        </div>
    </div>

    <!-- 🔥 FIREBASE 연동 🔥 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // [설정] 사장님 코드 적용
        const firebaseConfig = {
            apiKey: "AIzaSyABn9xi7a-3LyLpvS6HT03gJUGTlQkgHmk",
            authDomain: "enjoystock.firebaseapp.com",
            projectId: "enjoystock",
            storageBucket: "enjoystock.firebasestorage.app",
            messagingSenderId: "981969177924",
            appId: "1:981969177924:web:51b0093a0d1b001ead9b11"
        };

        // 🔍 [분석된 정확한 데이터 경로]
        const DATA_PATH = ['artifacts', 'enjoy-stock-live', 'public', 'data', 'stock_data', 'enjoy_ticker'];

        const priceEl = document.getElementById('ticker-price');
        const changeEl = document.getElementById('ticker-change');
        const polyline = document.getElementById('chart-line');
        const svg = document.getElementById('mini-chart');
        const marketBadge = document.getElementById('market-badge');
        
        // 장 마감 시간 설정
        const MARKET_START_HOUR = 8;
        const MARKET_START_MIN = 0;
        const MARKET_END_HOUR = 23;
        const MARKET_END_MIN = 30;

        // 장 상태 확인 함수
        function checkMarketStatus(manualPause = false) {
            const now = new Date(); 
            const currentTimeVal = now.getHours() * 60 + now.getMinutes(); 
            const startVal = MARKET_START_HOUR * 60 + MARKET_START_MIN;
            const endVal = MARKET_END_HOUR * 60 + MARKET_END_MIN; 
            
            // 장 운영 중인가? (시간 내 + 수동 정지 아님)
            const isOpen = (currentTimeVal >= startVal && currentTimeVal < endVal) && !manualPause;
            
            if (!isOpen) {
                marketBadge.classList.remove('hidden'); // 배지 보이기
                if (manualPause) {
                    marketBadge.innerText = "⏸ 일시정지";
                    marketBadge.className = "text-[9px] font-bold bg-gray-500 text-white px-1.5 py-0.5 rounded-full ml-1";
                } else {
                    marketBadge.innerText = "🌙 마감";
                    marketBadge.className = "text-[9px] font-bold bg-gray-800 text-white px-1.5 py-0.5 rounded-full ml-1";
                }
            } else {
                marketBadge.classList.add('hidden'); // 배지 숨기기
            }
        }

        // 차트 그리기 (전체 history 데이터를 받아서 그림)
        function drawChart(historyData, basePrice) {
            if (!svg || !historyData || historyData.length === 0) return;
            const width = svg.clientWidth || 120;
            const height = svg.clientHeight || 88;
            
            // 스케일 계산 (기준가 포함해서 범위 설정)
            let minVal = Math.min(...historyData); 
            let maxVal = Math.max(...historyData);
            minVal = Math.min(minVal, basePrice); 
            maxVal = Math.max(maxVal, basePrice);
            
            // 여백 추가
            const padding = (maxVal - minVal) * 0.1 || 10;
            maxVal += padding;
            minVal -= padding;
            const range = maxVal - minVal;

            let points = "";
            const totalPoints = historyData.length;
            
            // 데이터가 너무 많으면(94개 이상) 최근 것만 보여주거나, 전체를 압축해서 보여줌
            // 여기서는 전체 데이터를 X축에 균등하게 배치
            historyData.forEach((val, idx) => {
                const x = (idx / (totalPoints - 1)) * width;
                const normalized = (val - minVal) / range;
                const y = height - (normalized * height); // Y축 뒤집기 (위가 큰 값)
                points += `${x},${y} `;
            });
            polyline.setAttribute('points', points);
        }

        // 화면 업데이트 (서버 데이터 통째로 받음)
        function updateUI(data) {
            if (!data) {
                priceEl.innerText = "-";
                changeEl.innerText = "-";
                return;
            }

            const currentPrice = data.currentPrice;
            const basePrice = data.basePrice || 12000; // 기본값 안전장치
            const history = data.history || [];
            const manualPause = data.manualPause || false;

            // 1. 장 상태 업데이트
            checkMarketStatus(manualPause);

            // 2. 가격 표시
            priceEl.innerText = currentPrice.toLocaleString();
            
            const changeAmount = currentPrice - basePrice;
            const changePercent = ((changeAmount / basePrice) * 100).toFixed(2);
            
            if (changeAmount >= 0) {
                priceEl.className = "text-xl font-bold text-red-500 tabular-nums price-up";
                changeEl.className = "text-[10px] font-bold text-red-500 tabular-nums";
                changeEl.innerText = `▲ ${changePercent}%`;
                polyline.setAttribute('stroke', '#ef4444'); 
            } else {
                priceEl.className = "text-xl font-bold text-blue-500 tabular-nums price-down";
                changeEl.className = "text-[10px] font-bold text-blue-500 tabular-nums";
                changeEl.innerText = `▼ ${Math.abs(changePercent)}%`;
                polyline.setAttribute('stroke', '#3b82f6');
            }
            
            // 3. 차트 그리기 (history 데이터 사용)
            drawChart(history, basePrice);

            setTimeout(() => { priceEl.classList.remove('price-up', 'price-down'); }, 500);
        }

        // 초기화 로직
        async function init() {
            try {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                // 1. 인증 시도
                try {
                    await signInAnonymously(auth);
                    console.log("Auth 성공");
                } catch (authErr) {
                    console.warn("Auth 실패");
                }

                // 2. 데이터 감시 (정확한 주소!!)
                onSnapshot(doc(db, ...DATA_PATH), (doc) => {
                    if (doc.exists()) {
                        const data = doc.data();
                        updateUI(data); // 전체 데이터 넘김
                    } else {
                        updateUI(null);
                    }
                }, (error) => {
                    console.warn("데이터 접근 차단됨:", error);
                    updateUI(null);
                });

            } catch(e) {
                console.error("초기화 실패:", e);
                updateUI(null);
            }
        }

        init();
    </script>

    <!-- 일반 스크립트 -->
    <script>
        const LINKS = {
            music: "https://won429.github.io/enjoy/",      
            stock: "https://won429.github.io/enjoystock/",
            game: "https://won429.github.io/enjoygame/"
        };

        function showModal(modalId) { document.getElementById(modalId).classList.remove('hidden'); }
        function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }
        function goToMusic() { if (LINKS.music) window.location.href = LINKS.music; }
        function checkStock() { if (LINKS.stock) window.location.href = LINKS.stock; }
        function playGame() { if (LINKS.game) window.location.href = LINKS.game; }

        window.addEventListener('DOMContentLoaded', () => {
            showModal('startup-modal');
        });
    </script>
</body>
</html>
