<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enjoy Stock</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #fff;
      --text: #16181d;
      --muted: #7a828f;
      --up: #e53935;
      --down: #1e88e5;
      --line: #e8edf3;
      --primary: #2b6ff7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app { max-width: 460px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: var(--card); padding: 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
    .title { margin: 0; font-size: 22px; font-weight: 800; }
    .price-wrap { margin-top: 8px; display: flex; align-items: end; gap: 6px; }
    .price { font-size: 34px; font-weight: 900; letter-spacing: -0.5px; }
    .unit { font-size: 20px; font-weight: 700; }
    .diff { margin-top: 4px; font-size: 14px; font-weight: 600; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .tabs { display: grid; grid-template-columns: repeat(4,1fr); background: var(--card); border-bottom: 1px solid var(--line); }
    .tab-btn { border: 0; background: transparent; padding: 12px 8px; font-weight: 700; color: var(--muted); cursor: pointer; }
    .tab-btn.active { color: var(--text); border-bottom: 2px solid var(--text); }
    .view { display: none; padding: 14px; }
    .view.active { display: block; }
    .card { background: var(--card); border-radius: 14px; padding: 14px; border: 1px solid var(--line); }
    .card + .card { margin-top: 12px; }
    #chart { width: 100%; height: 210px; display: block; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .muted { color: var(--muted); font-size: 13px; }
    .book-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .book-row:last-child { border-bottom: 0; }
    .book-row span:nth-child(1) { color: #4e5968; text-align: right; padding-right: 8px; }
    .book-row span:nth-child(2) { text-align: center; font-weight: 800; }
    .book-row span:nth-child(3) { color: #4e5968; text-align: left; padding-left: 8px; }
    .trade-panel { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    input[type="number"] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #d9e1eb; font-size: 15px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.action { border: 0; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: 800; cursor: pointer; }
    .buy { background: #ffe5e5; color: var(--up); }
    .sell { background: #e7f1ff; color: var(--down); }
    .pill { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .log { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">엔조이 주식</h1>
      <div class="price-wrap">
        <div id="currentPrice" class="price">1,270</div>
        <div class="unit">원</div>
      </div>
      <div id="priceDiff" class="diff muted">기준가 대비 0원 (0.00%)</div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="chart">차트</button>
      <button class="tab-btn" data-tab="orderbook">호가</button>
      <button class="tab-btn" data-tab="wallet">지갑</button>
      <button class="tab-btn" data-tab="logs">내역</button>
    </nav>

    <section id="chart" class="view active">
      <div class="card">
        <canvas id="chartCanvas"></canvas>
        <div class="row muted" style="margin-top:8px;">
          <span>실시간 시뮬레이터 (1초)</span>
          <span id="marketState" class="pill" style="background:#edf4ff;color:#2b6ff7;">운영중</span>
        </div>
      </div>
    </section>

    <section id="orderbook" class="view">
      <div class="card">
        <div class="row" style="font-weight:700; margin-bottom:6px;"><span>매도잔량</span><span>가격</span><span>매수잔량</span></div>
        <div id="orderRows"></div>
      </div>
    </section>

    <section id="wallet" class="view">
      <div class="card">
        <div class="row"><span class="muted">보유 현금</span><strong id="cash">1,000,000원</strong></div>
        <div class="row" style="margin-top:8px;"><span class="muted">보유 수량</span><strong id="stocks">0주</strong></div>
        <div class="row" style="margin-top:8px;"><span class="muted">평균 단가</span><strong id="avg">0원</strong></div>
      </div>
      <div class="card">
        <div class="row"><span class="muted">평가 손익</span><strong id="pl">0원 (0.00%)</strong></div>
      </div>
    </section>

    <section id="logs" class="view">
      <div class="card" id="logList"><div class="muted">아직 거래 내역이 없습니다.</div></div>
    </section>

    <footer class="trade-panel">
      <div class="controls">
        <input id="priceInput" type="number" min="1" step="1" placeholder="가격" />
        <input id="qtyInput" type="number" min="1" step="1" value="1" />
      </div>
      <div class="btns">
        <button id="sellBtn" class="action sell">매도</button>
        <button id="buyBtn" class="action buy">매수</button>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const els = {
        currentPrice: document.getElementById('currentPrice'),
        priceDiff: document.getElementById('priceDiff'),
        chartCanvas: document.getElementById('chartCanvas'),
        marketState: document.getElementById('marketState'),
        orderRows: document.getElementById('orderRows'),
        cash: document.getElementById('cash'),
        stocks: document.getElementById('stocks'),
        avg: document.getElementById('avg'),
        pl: document.getElementById('pl'),
        logList: document.getElementById('logList'),
        priceInput: document.getElementById('priceInput'),
        qtyInput: document.getElementById('qtyInput'),
        buyBtn: document.getElementById('buyBtn'),
        sellBtn: document.getElementById('sellBtn')
      };

      const state = {
        basePrice: 1270,
        currentPrice: 1270,
        displayPrice: 1270,
        targetPrice: 1270,
        animTimer: null,
        tickTimer: null,
        history: [1270],
        walletCash: 1000000,
        walletStocks: 0,
        walletAvgPrice: 0,
        logs: []
      };

      const fmt = (n) => Math.round(n).toLocaleString('ko-KR');

      function getStepByGap(gap) {
        if (gap >= 1000) return 100;
        if (gap >= 200) return 10;
        return 5;
      }

      function animateDisplayPrice() {
        state.targetPrice = state.currentPrice;
        if (state.displayPrice === state.targetPrice) return;
        if (state.animTimer) clearInterval(state.animTimer);

        state.animTimer = setInterval(() => {
          const gap = state.targetPrice - state.displayPrice;
          if (gap === 0) {
            clearInterval(state.animTimer);
            state.animTimer = null;
            return;
          }
          const absGap = Math.abs(gap);
          const step = Math.min(getStepByGap(absGap), absGap);
          state.displayPrice += gap > 0 ? step : -step;
          renderHeader();
        }, 50);
      }

      function randomTick() {
        const drift = Math.floor(Math.random() * 13) - 6;
        const shock = Math.random() < 0.03 ? (Math.random() > 0.5 ? 80 : -80) : 0;
        state.currentPrice = Math.max(1, state.currentPrice + drift + shock);
        state.history.push(state.currentPrice);
        if (state.history.length > 80) state.history.shift();
        animateDisplayPrice();
        renderOrderBook();
        renderWallet();
        drawChart();
      }

      function renderHeader() {
        els.currentPrice.textContent = fmt(state.displayPrice);
        const diff = state.displayPrice - state.basePrice;
        const rate = ((diff / state.basePrice) * 100).toFixed(2);
        const sign = diff > 0 ? '+' : '';
        els.priceDiff.textContent = `기준가 대비 ${sign}${fmt(diff)}원 (${sign}${rate}%)`;
        els.priceDiff.className = `diff ${diff >= 0 ? 'up' : 'down'}`;
      }

      function renderOrderBook() {
        const rows = [];
        for (let i = 5; i >= 1; i--) {
          const p = state.currentPrice + i * 5;
          rows.push({ ask: Math.floor(Math.random() * 900 + 100), price: p, bid: Math.floor(Math.random() * 900 + 100) });
        }
        els.orderRows.innerHTML = rows.map(r =>
          `<div class="book-row"><span>${fmt(r.ask)}</span><span class="down">${fmt(r.price)}</span><span>${fmt(r.bid)}</span></div>`
        ).join('');
      }

      function addLog(type, msg) {
        const time = new Date().toLocaleTimeString('ko-KR');
        state.logs.unshift({ type, msg, time });
        if (state.logs.length > 30) state.logs.pop();
        renderLogs();
      }

      function renderLogs() {
        if (!state.logs.length) {
          els.logList.innerHTML = '<div class="muted">아직 거래 내역이 없습니다.</div>';
          return;
        }
        els.logList.innerHTML = state.logs.map((l) =>
          `<div class="log"><strong>[${l.type}]</strong> ${l.msg}<div class="muted">${l.time}</div></div>`
        ).join('');
      }

      function renderWallet() {
        els.cash.textContent = `${fmt(state.walletCash)}원`;
        els.stocks.textContent = `${fmt(state.walletStocks)}주`;
        els.avg.textContent = `${fmt(state.walletAvgPrice)}원`;

        const principal = state.walletAvgPrice * state.walletStocks;
        const evalValue = state.currentPrice * state.walletStocks;
        const diff = evalValue - principal;
        const rate = principal > 0 ? ((diff / principal) * 100).toFixed(2) : '0.00';
        const sign = diff > 0 ? '+' : '';
        els.pl.textContent = `${sign}${fmt(diff)}원 (${sign}${rate}%)`;
        els.pl.className = diff >= 0 ? 'up' : 'down';
      }

      function trade(type) {
        const price = Number(els.priceInput.value) || state.currentPrice;
        const qty = Math.max(1, Number(els.qtyInput.value) || 1);
        const cost = price * qty;

        if (type === 'buy') {
          if (state.walletCash < cost) {
            addLog('실패', `매수 실패: 잔액 부족 (${fmt(cost)}원 필요)`);
            return;
          }
          const totalQty = state.walletStocks + qty;
          const totalCost = state.walletAvgPrice * state.walletStocks + cost;
          state.walletCash -= cost;
          state.walletStocks = totalQty;
          state.walletAvgPrice = totalQty > 0 ? Math.round(totalCost / totalQty) : 0;
          addLog('매수', `${fmt(price)}원 × ${qty}주`);
        } else {
          if (state.walletStocks < qty) {
            addLog('실패', `매도 실패: 보유 수량 부족 (${qty}주 필요)`);
            return;
          }
          state.walletCash += cost;
          state.walletStocks -= qty;
          if (state.walletStocks === 0) state.walletAvgPrice = 0;
          addLog('매도', `${fmt(price)}원 × ${qty}주`);
        }

        renderWallet();
      }

      function initTabs() {
        const buttons = [...document.querySelectorAll('.tab-btn')];
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(btn.dataset.tab).classList.add('active');
          });
        });
      }

      function drawChart() {
        const canvas = els.chartCanvas;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        const ctx = canvas.getContext('2d');
        ctx.scale(devicePixelRatio, devicePixelRatio);

        const w = rect.width;
        const h = rect.height;
        ctx.clearRect(0, 0, w, h);

        const prices = state.history;
        const min = Math.min(...prices) - 10;
        const max = Math.max(...prices) + 10;
        const range = Math.max(1, max - min);

        ctx.strokeStyle = '#dfe7f1';
        ctx.lineWidth = 1;
        [0.25, 0.5, 0.75].forEach(r => {
          const y = h * r;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        });

        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = state.currentPrice >= state.basePrice ? '#e53935' : '#1e88e5';
        prices.forEach((p, i) => {
          const x = (w * i) / Math.max(1, prices.length - 1);
          const y = h - ((p - min) / range) * h;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      function init() {
        initTabs();
        renderHeader();
        renderOrderBook();
        renderWallet();
        renderLogs();
        drawChart();

        els.priceInput.value = state.currentPrice;
        els.buyBtn.addEventListener('click', () => trade('buy'));
        els.sellBtn.addEventListener('click', () => trade('sell'));

        state.tickTimer = setInterval(() => {
          randomTick();
          els.priceInput.value = state.currentPrice;
        }, 1000);

        window.addEventListener('resize', drawChart);
      }

      init();
    })();
  </script>
</body>
</html>
