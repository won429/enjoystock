<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Enjoy Stock - 2025 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" type="text/css"/>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, collection, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvTSA6_cpS60VxMxfv__NmYPn7h1vDtJs",
            authDomain: "enjoy-stock.firebaseapp.com",
            projectId: "enjoy-stock",
            storageBucket: "enjoy-stock.firebasestorage.app",
            messagingSenderId: "131055020348",
            appId: "1:131055020348:web:1d22b228c1916643861639"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'enjoy-stock-live';

        window.db = db;
        window.auth = auth;
        window.appId = appId;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        
        document.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        body { 
            font-family: "Pretendard", -apple-system, sans-serif;
            background-color: #ffffff;
            color: #191f28;
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 탭 메뉴 */
        .tab-item { position: relative; color: #8b95a1; font-weight: 600; cursor: pointer; transition: color 0.2s; }
        .tab-item.active { color: #191f28; }
        .tab-item.active::after { content: ''; position: absolute; bottom: -11px; left: 0; right: 0; height: 2px; background-color: #191f28; }

        /* 기간 버튼 */
        .period-btn { color: #8b95a1; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; transition: all 0.2s; }
        .period-btn.active { background-color: #f2f4f6; color: #191f28; font-weight: 700; }

        /* 호가창 */
        .order-row { display: grid; grid-template-columns: 1fr 1.2fr 1fr; height: 40px; align-items: center; border-bottom: 1px solid #f2f4f6; position: relative; }
        .order-cell { position: relative; height: 100%; display: flex; align-items: center; z-index: 10; padding: 0 8px; }
        .cell-ask-vol { justify-content: flex-end; color: #333; font-weight: 500; }
        .cell-price { justify-content: center; font-weight: 700; border-left: 1px solid #f2f4f6; border-right: 1px solid #f2f4f6; font-size: 14px; }
        .cell-bid-vol { justify-content: flex-start; color: #333; font-weight: 500; }

        .bg-ask { background-color: #f4f9ff; } 
        .text-ask { color: #3182f6; }
        .bg-bid { background-color: #fff4f4; } 
        .text-bid { color: #f04452; }
        .text-up { color: #f04452; } 
        .text-down { color: #3182f6; }
        
        .vol-bar { height: 100%; position: absolute; top: 0; z-index: 0; opacity: 0.15; }
        .vol-bar-ask { right: 0; background-color: #3182f6; } 
        .vol-bar-bid { left: 0; background-color: #f04452; } 

        /* 토스트 & 로딩 */
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-msg { animation: slideDown 0.3s ease-out forwards; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3182f6; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        /* 장 마감 오버레이 */
        #market-closed-overlay { backdrop-filter: blur(2px); }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-screen relative">

    <!-- 토스트 메시지 -->
    <div id="toast-container" class="absolute top-4 left-0 right-0 flex justify-center z-[60] pointer-events-none"></div>
    
    <!-- 로딩 오버레이 -->
    <div id="loading-overlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loader mb-4"></div>
        <p class="text-sm text-gray-500">서버 연결 중...</p>
    </div>

    <!-- 장 마감 오버레이 (차트 위에 표시) -->
    <div id="market-closed-overlay" class="absolute top-20 left-0 right-0 bottom-0 bg-white/50 z-40 hidden flex items-center justify-center pointer-events-none">
        <div class="bg-black/80 text-white px-4 py-2 rounded-full text-sm font-bold shadow-lg">
            🌙 장 마감
        </div>
    </div>

    <!-- 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 z-[70] hidden flex items-center justify-center px-6 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl">
            <h3 class="text-lg font-bold mb-4 text-center">관리자 로그인</h3>
            <input type="password" id="admin-pw" placeholder="비밀번호 입력" class="w-full bg-gray-100 rounded-xl px-4 py-3 mb-4 outline-none focus:ring-2 focus:ring-[#3182f6]" inputmode="numeric">
            <div class="flex gap-2">
                <button id="btn-login-cancel" class="flex-1 py-3 rounded-xl font-bold text-gray-500 hover:bg-gray-100">취소</button>
                <button id="btn-login-confirm" class="flex-1 py-3 rounded-xl font-bold bg-[#3182f6] text-white hover:bg-[#2b72d7]">확인</button>
            </div>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="px-5 pt-8 pb-2 bg-white z-20">
        <div class="flex justify-between items-start mb-2">
            <h1 class="text-2xl font-bold tracking-tight text-[#191f28] flex items-center gap-2">
                엔조이
                <!-- 알약 모양으로 개선 -->
                <span class="text-[9px] font-bold text-white bg-[#f04452] px-2 py-0.5 rounded-full tracking-tight shadow-sm">2025.11.23 상장</span>
                <span id="sync-status" class="w-2 h-2 rounded-full bg-gray-300 ml-1 flex-shrink-0" title="서버 연결 상태"></span>
            </h1>
            
            <!-- 관리자 로그인 버튼 -->
            <button id="btn-profile" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center transition-colors border border-gray-100 flex-shrink-0">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8b95a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
        </div>
        
        <div class="flex items-end gap-2 mb-1">
            <span id="current-price" class="text-3xl font-bold text-[#191f28]">-</span>
            <span class="text-xl font-bold text-[#191f28]">원</span>
        </div>
        
        <div class="flex items-center gap-1.5 text-sm font-medium">
            <span id="diff-label" class="text-[#8b95a1]">시작가보다</span>
            <span id="price-diff-box" class="flex items-center gap-1 text-[#8b95a1]">
                <span id="price-diff">-</span>
                <span id="price-rate"></span>
            </span>
        </div>
    </header>

    <!-- 탭 메뉴 -->
    <div class="flex items-center px-5 border-b border-[#f2f4f6] gap-6 text-[15px] mb-6 bg-white z-10">
        <button id="tab-chart" class="tab-item active py-2.5">차트</button>
        <button id="tab-order" class="tab-item py-2.5">호가</button>
        <button id="tab-info" class="tab-item py-2.5">종목정보</button>
    </div>

    <!-- 메인 컨텐츠 -->
    <main class="flex-1 flex flex-col relative overflow-hidden bg-white pb-32"> 
        
        <!-- 차트 뷰 -->
        <div id="view-chart" class="flex flex-col h-full w-full">
            <div class="px-5 mb-2 flex items-center gap-1">
                <div class="w-1.5 h-1.5 rounded-full bg-[#3182f6] animate-pulse" id="live-dot"></div>
                <span class="text-xs font-medium text-[#8b95a1]" id="chart-status-text">실시간</span>
            </div>
            <div class="w-full h-[320px] relative mt-2">
                <canvas id="chart-canvas" class="w-full h-full block"></canvas>
                <div id="label-high" class="absolute text-[11px] text-[#3182f6] font-medium transition-all duration-300 pointer-events-none opacity-0">최고 <span id="val-high">100</span>원</div>
                <div id="label-low" class="absolute text-[11px] text-[#3182f6] font-medium transition-all duration-300 pointer-events-none opacity-0">최저 <span id="val-low">100</span>원</div>
                <div class="absolute left-0 right-0 border-t border-dashed border-[#e5e8eb]" style="top: 50%;" id="base-line"></div>
                
                <div id="admin-indicator" class="hidden absolute top-2 right-4 bg-black/70 text-white text-[10px] px-2 py-1 rounded-full backdrop-blur-md">
                    ⚡ 관리자 개입 중
                </div>
            </div>
            <div class="px-4 mt-8 flex justify-between items-center bg-white" id="period-container">
                <button class="period-btn active" data-period="1D">1일</button>

                <button class="period-btn" data-period="3M">3달</button>
                <button class="period-btn" data-period="1Y">1년</button>
                <button class="period-btn" data-period="5Y">5년</button>
                <button class="period-btn" data-period="ALL">전체</button>
            </div>
        </div>

        <!-- 호가 뷰 -->
        <div id="view-order" class="hidden flex-col h-full w-full overflow-y-auto pb-10">
            <div class="grid grid-cols-[1fr_1.2fr_1fr] text-xs text-[#8b95a1] border-b border-[#f2f4f6] pb-2 px-0 bg-white sticky top-0 z-10">
                <div class="text-center">매도잔량</div>
                <div class="text-center">호가</div>
                <div class="text-center">매수잔량</div>
            </div>
            <div id="order-book-list" class="flex flex-col w-full"></div>
        </div>

        <!-- 종목정보 뷰 -->
        <div id="view-info" class="hidden flex-col h-full w-full px-5 pt-4">
            <div class="bg-[#f9fafb] p-5 rounded-2xl border border-[#f2f4f6]">
                <h3 class="font-bold text-lg mb-2">기업 개요</h3>
                <div class="text-sm text-[#6b7684] space-y-2">
                    <p><span class="font-bold text-[#333]">종목명</span> 엔조이 (Enjoy)</p>
                    <p><span class="font-bold text-[#333]">상장일</span> 2025.11.23</p>
                    <p><span class="font-bold text-[#333]">시작가</span> 100원</p>
                    <p class="leading-relaxed mt-2 pt-2 border-t border-[#eee]">
                        오늘 코스피 시장에 신규 상장된 엔터테인먼트 기업입니다.

    <!-- 관리자 패널 -->
    <div id="admin-panel" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 z-50 hidden shadow-[0_-5px_20px_rgba(0,0,0,0.1)] slide-up max-h-[40vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-3">
            <h4 class="font-bold text-[#191f28] text-sm">🛠️ 관리자 모드</h4>
            <span id="admin-timer" class="text-xs text-red-500 font-mono hidden">03:00</span>
        </div>
        
        <!-- 추세 제어 -->
        <div class="grid grid-cols-2 gap-3 mb-3">
            <button id="btn-admin-up" class="bg-[#f04452] text-white font-bold py-3 rounded-xl active:scale-95 transition-transform shadow-lg shadow-red-200">
                📈 상승 (3분)
            </button>
            <button id="btn-admin-down" class="bg-[#3182f6] text-white font-bold py-3 rounded-xl active:scale-95 transition-transform shadow-lg shadow-blue-200">
                📉 하락 (3분)
            </button>
        </div>

        <!-- 시장 제어 -->
        <div class="grid grid-cols-2 gap-3 mb-3">
            <button id="btn-market-open" class="bg-green-500 text-white font-bold py-2 rounded-xl active:scale-95 transition-transform text-sm">
                🔔 장 시작
            </button>
            <button id="btn-market-close" class="bg-gray-700 text-white font-bold py-2 rounded-xl active:scale-95 transition-transform text-sm">
                🌙 장 마감
            </button>
        </div>

        <button id="btn-logout" class="w-full bg-gray-100 text-gray-500 font-bold py-2 rounded-xl active:scale-95 transition-transform text-xs">
            로그아웃
        </button>
    </div>

    <script>
        document.addEventListener('firebase-ready', () => {
            // === DOM 요소 ===
            const els = {
                price: document.getElementById('current-price'),
                diffBox: document.getElementById('price-diff-box'),
                diffLabel: document.getElementById('diff-label'),
                diffVal: document.getElementById('price-diff'),
                rate: document.getElementById('price-rate'),
                canvas: document.getElementById('chart-canvas'),
                labelHigh: document.getElementById('label-high'),
                labelLow: document.getElementById('label-low'),
                valHigh: document.getElementById('val-high'),
                valLow: document.getElementById('val-low'),
                baseLine: document.getElementById('base-line'),
                liveDot: document.getElementById('live-dot'),
                orderList: document.getElementById('order-book-list'),
                viewChart: document.getElementById('view-chart'),
                viewOrder: document.getElementById('view-order'),
                viewInfo: document.getElementById('view-info'),
                tabChart: document.getElementById('tab-chart'),
                tabOrder: document.getElementById('tab-order'),
                tabInfo: document.getElementById('tab-info'),
                periodBtns: document.querySelectorAll('.period-btn'),
                toastContainer: document.getElementById('toast-container'),
                loadingOverlay: document.getElementById('loading-overlay'),
                syncStatus: document.getElementById('sync-status'),
                btnProfile: document.getElementById('btn-profile'),
                loginModal: document.getElementById('login-modal'),
                inputPw: document.getElementById('admin-pw'),
                btnLoginConfirm: document.getElementById('btn-login-confirm'),
                btnLoginCancel: document.getElementById('btn-login-cancel'),
                adminPanel: document.getElementById('admin-panel'),
                btnAdminUp: document.getElementById('btn-admin-up'),
                btnAdminDown: document.getElementById('btn-admin-down'),
                btnLogout: document.getElementById('btn-logout'),
                adminTimer: document.getElementById('admin-timer'),
                adminIndicator: document.getElementById('admin-indicator'),
                btnMarketOpen: document.getElementById('btn-market-open'),
                btnMarketClose: document.getElementById('btn-market-close'),
                marketOverlay: document.getElementById('market-closed-overlay')
            };

            const fmt = n => n.toLocaleString();
            const showToast = (msg) => {
                const toast = document.createElement('div');
                toast.className = 'toast-msg bg-[#333] text-white text-xs px-4 py-2 rounded-full shadow-lg mb-2 pointer-events-auto';
                toast.innerText = msg;
                els.toastContainer.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.5s'; setTimeout(() => toast.remove(), 500); }, 2000);
            };

            // === 상태 ===
            let state = {
                currentPrice: 100,
                startPrice: 100,
                history: [100], 
                tab: 'chart',
                lastUpdated: 0,
                isConnected: false,
                adminTrend: null,
                adminTrendUntil: 0,
                marketStatus: 'open', // 'open' | 'closed'
                isAdmin: false
            };

            // === 1. Firebase Auth & Data ===
            const initAuth = async () => {
                try { await window.signInAnonymously(window.auth); } catch (e) { console.error(e); }
            };
            initAuth();

            window.onAuthStateChanged(window.auth, (user) => {
                if (user) {
                    startSync(user.uid);
                    els.loadingOverlay.style.opacity = '0';
                    setTimeout(() => els.loadingOverlay.style.display = 'none', 500);
                }
            });

            const startSync = (userId) => {
                const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'enjoy_ticker');

                window.onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        state.currentPrice = data.currentPrice;
                        state.history = data.history || [100];
                        state.lastUpdated = data.lastUpdated || 0;
                        state.adminTrend = data.adminTrend || null;
                        state.adminTrendUntil = data.adminTrendUntil || 0;
                        state.marketStatus = data.marketStatus || 'open';
                        state.isConnected = true;
                        els.syncStatus.classList.remove('bg-gray-300', 'bg-red-500');
                        els.syncStatus.classList.add('bg-green-500');
                        updateUI();
                    } else {
                        initializeData(docRef);
                    }
                }, (error) => {
                    console.error("Sync Error:", error);
                    els.syncStatus.classList.add('bg-red-500');
                });

                setInterval(async () => {
                    if (!state.isConnected) return;
                    
                    // 장 마감 상태면 업데이트 중단
                    if (state.marketStatus === 'closed') return;

                    const now = Date.now();
                    if (now - state.lastUpdated > 1200) {
                        let change = 0;
                        
                        // 관리자 개입
                        if (state.adminTrend && state.adminTrendUntil > now) {
                            if (state.adminTrend === 'up') { change = Math.floor(Math.random() * 6) + 2; } 
                            else { change = Math.floor(Math.random() * -6) - 2; }
                        } else {
                            // 완전 랜덤 (상승/하락 50:50)
                            change = Math.floor(Math.random() * 11) - 5; 
                            if (change === 0) change = Math.random() > 0.5 ? 1 : -1;
                        }

                        let nextPrice = state.currentPrice + change;
                        if(nextPrice < 1) nextPrice = 1;

                        const newHistory = [...state.history, nextPrice];
                        if (newHistory.length > 300) newHistory.shift();
                        
                        let newTrend = state.adminTrend;
                        let newTrendUntil = state.adminTrendUntil;
                        if (state.adminTrend && now > state.adminTrendUntil) { newTrend = null; }

                        try {
                            await window.updateDoc(docRef, {
                                currentPrice: nextPrice,
                                history: newHistory,
                                lastUpdated: now,
                                adminTrend: newTrend,
                                adminTrendUntil: newTrendUntil,
                                marketStatus: state.marketStatus
                            });
                        } catch (e) {}
                    }
                }, 1000);
            };

            const initializeData = async (docRef) => {
                try {
                    await window.setDoc(docRef, {
                        currentPrice: 100,
                        history: [100],
                        lastUpdated: Date.now(),
                        adminTrend: null,
                        adminTrendUntil: 0,
                        marketStatus: 'open'
                    });
                } catch(e) {}
            };

            // === 2. 관리자 기능 ===
            els.btnProfile.onclick = () => {
                if (state.isAdmin) { showToast("이미 관리자로 로그인되어 있습니다."); } 
                else { els.loginModal.classList.remove('hidden'); els.inputPw.value = ''; els.inputPw.focus(); }
            };
            els.btnLoginCancel.onclick = () => els.loginModal.classList.add('hidden');
            els.btnLoginConfirm.onclick = () => {
                if (els.inputPw.value === '0920') {
                    state.isAdmin = true;
                    els.loginModal.classList.add('hidden');
                    els.adminPanel.classList.remove('hidden');
                    showToast("관리자 모드 실행됨");
                } else { showToast("비밀번호가 틀렸습니다."); els.inputPw.value = ''; }
            };
            els.btnLogout.onclick = () => {
                state.isAdmin = false;
                els.adminPanel.classList.add('hidden');
                showToast("로그아웃 되었습니다.");
            };
            const setTrend = async (trend) => {
                if (!state.isConnected) return;
                const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'enjoy_ticker');
                const duration = 3 * 60 * 1000; 
                try {
                    await window.updateDoc(docRef, { adminTrend: trend, adminTrendUntil: Date.now() + duration });
                    const label = trend === 'up' ? '상승' : '하락';
                    showToast(`3분간 ${label} 추세가 적용됩니다.`);
                } catch (e) { showToast("명령 전송 실패"); }
            };
            
            // 장 상태 제어 함수
            const setMarketStatus = async (status) => {
                if (!state.isConnected) return;
                const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'enjoy_ticker');
                try {
                    await window.updateDoc(docRef, { marketStatus: status });
                    showToast(status === 'open' ? "장이 시작되었습니다." : "장이 마감되었습니다.");
                } catch (e) { showToast("명령 전송 실패"); }
            };

            els.btnAdminUp.onclick = () => setTrend('up');
            els.btnAdminDown.onclick = () => setTrend('down');
            els.btnMarketOpen.onclick = () => setMarketStatus('open');
            els.btnMarketClose.onclick = () => setMarketStatus('closed');

            // === 3. UI 렌더링 ===
            const ctx = els.canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            let size = { w: 0, h: 0 };
            const resize = () => {
                const rect = els.canvas.getBoundingClientRect();
                if(rect.width === 0) return;
                els.canvas.width = rect.width * dpr;
                els.canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                size = { w: rect.width, h: rect.height };
            };
            window.addEventListener('resize', resize);
            
            const drawChart = () => {
                if(state.tab !== 'chart') return;
                const { w, h } = size;
                if(w === 0) resize();
                ctx.clearRect(0, 0, w, h);

                const data = state.history;
                let minVal = Math.min(...data, 100);
                let maxVal = Math.max(...data, 100);
                if (maxVal === minVal) { maxVal += 10; minVal -= 10; } 
                else { const padding = (maxVal - minVal) * 0.1; maxVal += padding; minVal -= padding; }
                const range = maxVal - minVal;
                const baseY = h - ((100 - minVal) / range) * h;
                
                els.baseLine.style.top = `${(baseY / h) * 100}%`;
                const isUp = state.currentPrice >= 100;
                const color = isUp ? '#f04452' : '#3182f6';
                
                els.labelHigh.style.color = color; els.labelLow.style.color = color; els.liveDot.style.backgroundColor = color;

                ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                if (data.length === 1) { ctx.moveTo(0, baseY); ctx.lineTo(w, baseY); } 
                else {
                    const step = w / (data.length - 1);
                    data.forEach((p, i) => {
                        const x = i * step; const y = h - ((p - minVal) / range) * h;
                        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    });
                }
                ctx.stroke();

                if (data.length > 1) {
                    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
                    const grad = ctx.createLinearGradient(0, 0, 0, h);
                    grad.addColorStop(0, isUp ? 'rgba(240, 68, 82, 0.05)' : 'rgba(49, 130, 246, 0.05)');
                    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = grad; ctx.fill();
                }

                const maxValData = Math.max(...data); const minValData = Math.min(...data);
                const step = w / (Math.max(data.length - 1, 1));
                const maxIdx = data.lastIndexOf(maxValData); const minIdx = data.lastIndexOf(minValData);
                els.valHigh.innerText = Math.round(maxValData); els.valLow.innerText = Math.round(minValData);
                
                const maxPos = { x: maxIdx * step, y: h - ((maxValData - minVal) / range) * h };
                const minPos = { x: minIdx * step, y: h - ((minValData - minVal) / range) * h };
                
                const labelX_Max = Math.min(Math.max(maxPos.x, 30), w - 30);
                const labelX_Min = Math.min(Math.max(minPos.x, 30), w - 30);
                
                els.labelHigh.style.opacity = 1; els.labelHigh.style.left = `${labelX_Max}px`; els.labelHigh.style.top = `${maxPos.y - 25}px`;
                els.labelLow.style.opacity = 1; els.labelLow.style.left = `${labelX_Min}px`; els.labelLow.style.top = `${minPos.y + 10}px`;
                
                [maxPos, minPos].forEach(pos => { ctx.beginPath(); ctx.fillStyle = 'white'; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
                
                const lastIdx = data.length - 1; const lastX = lastIdx * step; const lastY = h - ((data[lastIdx] - minVal) / range) * h;
                ctx.beginPath(); ctx.fillStyle = color; ctx.arc(lastX, lastY, 4, 0, Math.PI * 2); ctx.fill();
            };

            const renderOrderBook = () => {
                const curr = state.currentPrice;
                const spread = Math.max(1, Math.floor(curr * 0.01)); 
                let html = '';
                // 모바일 최적화 구조
                for(let i=5; i>=1; i--) {
                    const p = curr + (i * spread);
                    const vol = Math.floor(Math.random() * 2000) + 100;
                    const width = Math.min(vol / 30, 100); 
                    html += `
                    <div class="order-row bg-ask">
                        <div class="order-cell cell-ask-vol">
                            <div class="vol-bar vol-bar-ask" style="width: ${width}%;"></div>
                            <span class="relative z-10">${vol}</span>
                        </div>
                        <div class="order-cell cell-price text-down">${fmt(p)}</div>
                        <div class="order-cell cell-bid-vol"></div>
                    </div>`;
                }
                for(let i=0; i<5; i++) {
                    const p = curr - (i * spread);
                    if (p < 1) continue; 
                    const priceDisplay = p;
                    const vol = Math.floor(Math.random() * 2000) + 100;
                    const width = Math.min(vol / 30, 100);
                    html += `
                    <div class="order-row bg-bid">
                        <div class="order-cell cell-ask-vol"></div>
                        <div class="order-cell cell-price text-up">${fmt(priceDisplay)}</div>
                        <div class="order-cell cell-bid-vol">
                            <div class="vol-bar vol-bar-bid" style="width: ${width}%;"></div>
                            <span class="relative z-10">${vol}</span>
                        </div>
                    </div>`;
                }
                els.orderList.innerHTML = html;
            };

            const updateUI = () => {
                els.price.innerText = fmt(state.currentPrice);
                const diff = state.currentPrice - 100; 
                const rate = ((diff / 100) * 100).toFixed(1);
                const sign = diff > 0 ? '+' : '';
                const isUp = diff >= 0;

                els.diffVal.innerText = `${sign}${diff}원`;
                els.rate.innerText = `(${sign}${rate}%)`;
                els.diffBox.className = `flex items-center gap-1 ${isUp ? 'text-up' : 'text-down'}`;

                const now = Date.now();
                
                // 관리자 표시
                if (state.adminTrend && state.adminTrendUntil > now) {
                    els.adminIndicator.classList.remove('hidden');
                    const timeLeft = Math.ceil((state.adminTrendUntil - now) / 1000);
                    const mins = Math.floor(timeLeft / 60);
                    const secs = timeLeft % 60;
                    els.adminTimer.innerText = `${mins}:${secs < 10 ? '0'+secs : secs}`;
                    els.adminTimer.classList.remove('hidden');
                } else {
                    els.adminIndicator.classList.add('hidden');
                    els.adminTimer.classList.add('hidden');
                }

                // 장 마감 표시
                if (state.marketStatus === 'closed') {
                    els.marketOverlay.classList.remove('hidden');
                    els.liveDot.classList.remove('animate-pulse');
                    els.liveDot.classList.replace('bg-[#3182f6]', 'bg-gray-400');
                } else {
                    els.marketOverlay.classList.add('hidden');
                    els.liveDot.classList.add('animate-pulse');
                    els.liveDot.classList.replace('bg-gray-400', 'bg-[#3182f6]');
                }

                if(state.tab === 'chart') drawChart();
                else if(state.tab === 'order') renderOrderBook();
            };

            els.periodBtns.forEach(btn => {
                btn.onclick = (e) => {
                    els.periodBtns.forEach(b => b.classList.remove('active')); e.target.classList.add('active');
                    if (e.target.dataset.period !== '1D') showToast("오늘 상장되어 과거 데이터가 없습니다.");
                    drawChart();
                };
            });

            const switchTab = (tabName) => {
                state.tab = tabName;
                [els.tabChart, els.tabOrder, els.tabInfo].forEach(btn => btn.classList.remove('active'));
                if(tabName === 'chart') els.tabChart.classList.add('active');
                if(tabName === 'order') els.tabOrder.classList.add('active');
                if(tabName === 'info') els.tabInfo.classList.add('active');

                els.viewChart.classList.add('hidden');
                els.viewOrder.classList.add('hidden');
                els.viewInfo.classList.add('hidden');

                if(tabName === 'chart') { els.viewChart.classList.remove('hidden'); resize(); drawChart(); } 
                else if(tabName === 'order') { els.viewOrder.classList.remove('hidden'); els.viewOrder.classList.add('flex'); renderOrderBook(); } 
                else { els.viewInfo.classList.remove('hidden'); els.viewInfo.classList.add('flex'); }
            };

            els.tabChart.onclick = () => switchTab('chart');
            els.tabOrder.onclick = () => switchTab('order');
            els.tabInfo.onclick = () => switchTab('info');
        });
    </script>
</body>
</html>
