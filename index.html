<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Enjoy Stock - Shared Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" type="text/css"/>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvTSA6_cpS60VxMxfv__NmYPn7h1vDtJs",
            authDomain: "enjoy-stock.firebaseapp.com",
            projectId: "enjoy-stock",
            storageBucket: "enjoy-stock.firebasestorage.app",
            messagingSenderId: "131055020348",
            appId: "1:131055020348:web:1d22b228c1916643861639"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'enjoy-stock-live';

        window.db = db;
        window.auth = auth;
        window.appId = appId;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.getDoc = getDoc;
        
        document.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        body { 
            font-family: "Pretendard", -apple-system, sans-serif;
            background-color: #ffffff;
            color: #191f28;
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 탭 메뉴 */
        .tab-item { position: relative; color: #8b95a1; font-weight: 600; cursor: pointer; transition: color 0.2s; }
        .tab-item.active { color: #191f28; }
        .tab-item.active::after { content: ''; position: absolute; bottom: -11px; left: 0; right: 0; height: 2px; background-color: #191f28; }

        /* 호가창 */
        .order-row { display: grid; grid-template-columns: 1fr 1.2fr 1fr; height: 40px; align-items: center; border-bottom: 1px solid #f2f4f6; position: relative; }
        .order-cell { position: relative; height: 100%; display: flex; align-items: center; z-index: 10; padding: 0 8px; }
        .cell-ask-vol { justify-content: flex-end; color: #333; font-weight: 500; font-size: 12px; }
        .cell-price { justify-content: center; font-weight: 700; border-left: 1px solid #f2f4f6; border-right: 1px solid #f2f4f6; font-size: 13px; }
        .cell-bid-vol { justify-content: flex-start; color: #333; font-weight: 500; font-size: 12px; }

        .bg-ask { background-color: #f4f9ff; } .text-ask { color: #3182f6; }
        .bg-bid { background-color: #fff4f4; } .text-bid { color: #f04452; }
        .text-up { color: #f04452; } .text-down { color: #3182f6; }
        
        .vol-bar { height: 100%; position: absolute; top: 0; z-index: 0; opacity: 0.15; }
        .vol-bar-ask { right: 0; background-color: #3182f6; } .vol-bar-bid { left: 0; background-color: #f04452; } 

        /* 애니메이션 */
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-msg { animation: slideDown 0.3s ease-out forwards; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3182f6; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        #market-closed-overlay { backdrop-filter: blur(2px); }
        .divider-section { border-top: 8px solid #f2f4f6; margin-top: 20px; padding-top: 20px; }
        .trade-bar { box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }

        /* 주문 내역 스타일 */
        .log-item { font-size: 12px; padding: 8px 0; border-bottom: 1px solid #f2f4f6; display: flex; justify-content: space-between; align-items: center; }
        .log-item:last-child { border-bottom: none; }
        .log-time { color: #8b95a1; font-size: 10px; margin-right: 8px; }
        .log-tag { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; margin-right: 6px; }
        .log-buy { background-color: #fff4f4; color: #f04452; }
        .log-sell { background-color: #f4f9ff; color: #3182f6; }
        .log-deposit { background-color: #f2f4f6; color: #333; }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-screen relative">

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>

            <button id="btn-market-pause" class="bg-gray-700 text-white font-bold py-2 rounded-xl active:scale-95 transition-transform text-sm">⏸ 장 일시정지</button>
        </div>
        <div class="bg-gray-50 p-3 rounded-xl mb-3 border border-gray-200">
            <p class="text-xs font-bold text-gray-500 mb-2">💰 공용 지갑 입금 (관리자용)</p>
            <div class="flex gap-2">
                <input type="number" id="deposit-input" placeholder="금액 입력" class="flex-1 bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">

            </div>

    <script>
        document.addEventListener('firebase-ready', () => {
            const els = {
                price: document.getElementById('current-price'), diffBox: document.getElementById('price-diff-box'),
                diffLabel: document.getElementById('diff-label'), diffVal: document.getElementById('price-diff'), rate: document.getElementById('price-rate'),
                chartContainer: document.getElementById('chart-container'), canvas: document.getElementById('chart-canvas'),
                labelHigh: document.getElementById('label-high'), labelLow: document.getElementById('label-low'), valHigh: document.getElementById('val-high'), valLow: document.getElementById('val-low'),
                baseLine: document.getElementById('base-line'), liveDot: document.getElementById('live-dot'),
                orderList: document.getElementById('order-book-list'),
                viewChart: document.getElementById('view-chart'), viewOrder: document.getElementById('view-order'), viewInfo: document.getElementById('view-info'),
                tabChart: document.getElementById('tab-chart'), tabOrder: document.getElementById('tab-order'), tabInfo: document.getElementById('tab-info'),
                toastContainer: document.getElementById('toast-container'), loadingOverlay: document.getElementById('loading-overlay'), syncStatus: document.getElementById('sync-status'),
                btnProfile: document.getElementById('btn-profile'), btnHome: document.getElementById('btn-home'),
                loginModal: document.getElementById('login-modal'), inputPw: document.getElementById('admin-pw'),
                btnLoginConfirm: document.getElementById('btn-login-confirm'), btnLoginCancel: document.getElementById('btn-login-cancel'),
                adminPanel: document.getElementById('admin-panel'), btnAdminUp: document.getElementById('btn-admin-up'), btnAdminDown: document.getElementById('btn-admin-down'), btnLogout: document.getElementById('btn-logout'), adminTimer: document.getElementById('admin-timer'),
                btnMarketResume: document.getElementById('btn-market-resume'), btnMarketPause: document.getElementById('btn-market-pause'),
                marketMsgContainer: document.getElementById('market-msg-container'), marketMsgBadge: document.getElementById('market-msg-badge'), chartStatus: document.getElementById('chart-status-text'),
                // Wallet & History
                myCash: document.getElementById('my-cash'), myStockCnt: document.getElementById('my-stock-cnt'), myAvgPrice: document.getElementById('my-avg-price'), myReturnRate: document.getElementById('my-return-rate'),
                btnBuy: document.getElementById('btn-buy'), btnSell: document.getElementById('btn-sell'), depositInput: document.getElementById('deposit-input'), btnAdminDeposit: document.getElementById('btn-admin-deposit'),
                historyList: document.getElementById('trade-history-list')
            };

            const fmt = n => n.toLocaleString();
            const showToast = (msg) => {
                const toast = document.createElement('div');
                toast.className = 'toast-msg bg-[#333] text-white text-xs px-4 py-2 rounded-full shadow-lg mb-2 pointer-events-auto';
                toast.innerText = msg;
                els.toastContainer.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.5s'; setTimeout(() => toast.remove(), 500); }, 2000);
            };

            let state = {
                currentPrice: 100, basePrice: 100, basePriceLabel: "시작가보다", history: [100], tab: 'chart',
                lastUpdated: 0, isConnected: false, adminTrend: null, adminTrendUntil: 0, manualPause: false, isAdmin: false,
                chartOffset: 0, isDragging: false, lastX: 0, marketMood: 'neutral', nextMoodChange: 0,
                walletCash: 0, walletStocks: 0, walletAvgPrice: 0,
                tradeLogs: []
            };

            const ctx = els.canvas.getContext('2d');
            let size = { w: 0, h: 0 };
            const resize = () => { 
                const rect = els.canvas.getBoundingClientRect(); 
                if(rect.width === 0) return; 
                els.canvas.width = rect.width * window.devicePixelRatio; 
                els.canvas.height = rect.height * window.devicePixelRatio; 
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio); 
                size = { w: rect.width, h: rect.height }; 
            };
            window.addEventListener('resize', resize);

            const initAuth = async () => { try { await window.signInAnonymously(window.auth); } catch (e) { console.error(e); } };
            initAuth();

            window.onAuthStateChanged(window.auth, (user) => {
                if (user) {
                    startSync();
                    startWalletSync();
                    startHistorySync(); // 주문 내역 동기화
                    els.loadingOverlay.style.opacity = '0'; setTimeout(() => els.loadingOverlay.style.display = 'none', 500);
                    resize();
                }
            });

            const startSync = () => {
                const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'enjoy_ticker');
                window.onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        state.currentPrice = data.currentPrice; state.history = data.history || [100]; state.lastUpdated = data.lastUpdated || 0;
                        state.adminTrend = data.adminTrend || null; state.adminTrendUntil = data.adminTrendUntil || 0; state.manualPause = data.manualPause || false;
                        state.basePrice = data.basePrice || 100; state.basePriceLabel = data.basePriceLabel || "시작가보다";
                        state.marketMood = data.marketMood || 'neutral'; state.nextMoodChange = data.nextMoodChange || 0;
                        state.isConnected = true;
                        els.syncStatus.classList.remove('bg-gray-300', 'bg-red-500'); els.syncStatus.classList.add('bg-green-500');
                        if (state.chartOffset === 0) updateUI(); else drawChart();
                        updateWalletUI();
                    } else initializeData(docRef);
                });

                setInterval(async () => {
                    if (!state.isConnected) return;
                    const now = new Date();
                    const currentTimeVal = now.getHours() * 60 + now.getMinutes();
                    const isMarketOpen = (currentTimeVal >= 480 && currentTimeVal < 1410);
                    
                    if (isMarketOpen && !state.manualPause) {
                        if (Date.now() - state.lastUpdated > 1200) {
                            let nextBasePrice = state.basePrice; let nextBaseLabel = state.basePriceLabel;
                            if (now.getDate() > 23 && nextBasePrice === 100) nextBaseLabel = "어제보다";
                            let currentMood = state.marketMood; let nextChange = state.nextMoodChange;
                            if (Date.now() > nextChange) {
                                const rand = Math.random();
                                if (rand < 0.33) currentMood = 'bull'; else if (rand < 0.66) currentMood = 'bear'; else currentMood = 'neutral';
                                nextChange = Date.now() + (10 * 60 * 1000);
                            }
                            let change = 0;
                            if (state.adminTrend && state.adminTrendUntil > Date.now()) {
                                if (state.adminTrend === 'up') change = Math.floor(Math.random() * 6) + 2; else change = Math.floor(Math.random() * -6) - 2;
                            } else {
                                if (currentMood === 'bull') change = Math.floor(Math.random() * 10) - 3; else if (currentMood === 'bear') change = Math.floor(Math.random() * 10) - 6; else change = Math.floor(Math.random() * 11) - 5;
                                if (change === 0) change = Math.random() > 0.5 ? 1 : -1;
                            }
                            let nextPrice = state.currentPrice + change;
                            if(nextPrice < 1) nextPrice = 1;
                            const newHistory = [...state.history, nextPrice];
                            if (newHistory.length > 1000) newHistory.shift();
                            let newTrend = state.adminTrend; let newTrendUntil = state.adminTrendUntil;
                            if (state.adminTrend && Date.now() > state.adminTrendUntil) newTrend = null;

                            state.currentPrice = nextPrice; state.history = newHistory; state.lastUpdated = Date.now();
                            state.marketMood = currentMood; state.nextMoodChange = nextChange;
                            if (state.chartOffset === 0) updateUI(); updateWalletUI();

                            try {
                                await window.updateDoc(docRef, {
                                    currentPrice: nextPrice, history: newHistory, lastUpdated: Date.now(),
                                    adminTrend: newTrend, adminTrendUntil: newTrendUntil, manualPause: state.manualPause,
                                    basePriceLabel: nextBaseLabel, marketMood: currentMood, nextMoodChange: nextChange
                                });
                            } catch (e) {}
                        }
                    }
                }, 1000);
                setInterval(() => { if (state.isAdmin) updateUI(); }, 500);
            };

            const initializeData = async (docRef) => {
                try { await window.setDoc(docRef, { currentPrice: 100, history: [100], lastUpdated: Date.now(), adminTrend: null, adminTrendUntil: 0, manualPause: false, basePrice: 100, basePriceLabel: "시작가보다", marketMood: 'neutral', nextMoodChange: Date.now() + 600000 }); } catch(e) {}
            };

            const startWalletSync = () => {
                const walletDocRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'shared_wallet');
                window.onSnapshot(walletDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        state.walletCash = data.cash || 0; state.walletStocks = data.stocks || 0; state.walletAvgPrice = data.avgPrice || 0;
                        updateWalletUI();
                    } else { window.setDoc(walletDocRef, { cash: 0, stocks: 0, avgPrice: 0 }); }
                });
            };

            // History Sync (New)
            const startHistorySync = () => {
                const histDocRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'trade_history');
                window.onSnapshot(histDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        state.tradeLogs = snapshot.data().logs || [];
                        renderHistory();
                    } else { window.setDoc(histDocRef, { logs: [] }); }
                });
            };

            const addHistoryLog = async (type, detail) => {
                const histDocRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'trade_history');
                const newLog = { type, detail, time: Date.now() };
                // 간단히 읽고 쓰기 (동시성 무시 - 로그는 덜 중요함)
                const currentLogs = state.tradeLogs;
                const updatedLogs = [newLog, ...currentLogs].slice(0, 30); // 최신 30개만 저장
                await window.updateDoc(histDocRef, { logs: updatedLogs });
            };

            const renderHistory = () => {
                if (state.tradeLogs.length === 0) {
                    els.historyList.innerHTML = '<div class="text-center py-4 text-xs text-gray-400">아직 거래 내역이 없습니다.</div>';
                    return;
                }
                els.historyList.innerHTML = state.tradeLogs.map(log => {
                    const date = new Date(log.time);
                    const timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}:${String(date.getSeconds()).padStart(2,'0')}`;
                    let tagClass = 'log-deposit'; let tagText = '알림';
                    if (log.type === 'buy') { tagClass = 'log-buy'; tagText = '매수'; }
                    else if (log.type === 'sell') { tagClass = 'log-sell'; tagText = '매도'; }
                    else if (log.type === 'deposit') { tagClass = 'log-deposit'; tagText = '입금'; }
                    return `
                        <div class="log-item">
                            <div class="flex items-center">
                                <span class="log-time">${timeStr}</span>
                                <span class="log-tag ${tagClass}">${tagText}</span>
                                <span class="text-[#333]">${log.detail}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            };

            const updateWalletUI = () => {
                els.myCash.innerText = fmt(state.walletCash); els.myStockCnt.innerText = fmt(state.walletStocks); els.myAvgPrice.innerText = fmt(Math.round(state.walletAvgPrice));
                if (state.walletStocks > 0 && state.walletAvgPrice > 0) {
                    const returnRate = ((state.currentPrice - state.walletAvgPrice) / state.walletAvgPrice) * 100;
                    els.myReturnRate.innerText = `${returnRate > 0 ? '+' : ''}${returnRate.toFixed(2)}%`;
                    els.myReturnRate.className = `text-xs font-bold ${returnRate >= 0 ? 'text-[#f04452]' : 'text-[#3182f6]'}`;
                } else { els.myReturnRate.innerText = "0%"; els.myReturnRate.className = "text-xs font-bold text-gray-400"; }
            };

            const handleTrade = async (type) => {
                const walletDocRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'shared_wallet');
                try {
                    const snapshot = await window.getDoc(walletDocRef);
                    if (!snapshot.exists()) return;
                    const data = snapshot.data();
                    const currentCash = data.cash || 0; const currentStocks = data.stocks || 0; const currentAvg = data.avgPrice || 0;

                    if (type === 'buy') {
                        if (currentCash < state.currentPrice) { showToast("공용 현금이 부족합니다!"); return; }
                        const newCash = currentCash - state.currentPrice;
                        const totalValue = (currentStocks * currentAvg) + state.currentPrice;
                        const newStocks = currentStocks + 1;
                        const newAvg = totalValue / newStocks;
                        await window.updateDoc(walletDocRef, { cash: newCash, stocks: newStocks, avgPrice: newAvg });
                        addHistoryLog('buy', `1주 매수 체결 (${fmt(state.currentPrice)}원)`);
                        showToast(`공용 지갑: 1주 매수 (${fmt(state.currentPrice)}원)`);
                    } else if (type === 'sell') {
                        if (currentStocks <= 0) { showToast("보유 주식이 없습니다!"); return; }
                        const newCash = currentCash + state.currentPrice;
                        const newStocks = currentStocks - 1;
                        const newAvg = newStocks === 0 ? 0 : currentAvg;
                        await window.updateDoc(walletDocRef, { cash: newCash, stocks: newStocks, avgPrice: newAvg });
                        addHistoryLog('sell', `1주 매도 체결 (${fmt(state.currentPrice)}원)`);
                        showToast(`공용 지갑: 1주 매도 (${fmt(state.currentPrice)}원)`);
                    }
                } catch(e) { console.error("Trade Error", e); }
            };

            els.btnBuy.onclick = () => handleTrade('buy');
            els.btnSell.onclick = () => handleTrade('sell');

            els.btnAdminDeposit.onclick = async () => {
                const amount = parseInt(els.depositInput.value);
                if (isNaN(amount) || amount <= 0) { showToast("올바른 금액을 입력하세요."); return; }
                const walletDocRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'shared_wallet');
                try {
                    const snapshot = await window.getDoc(walletDocRef);
                    const currentCash = snapshot.exists() ? (snapshot.data().cash || 0) : 0;
                    await window.updateDoc(walletDocRef, { cash: currentCash + amount });
                    addHistoryLog('deposit', `관리자 입금 ${fmt(amount)}원`);
                    showToast(`${fmt(amount)}원 공용 입금 완료!`);
                    els.depositInput.value = '';
                } catch(e) { console.error("Deposit Error", e); }
            };

            // Chart logic (same as before)
            const handleStart = (x) => { state.isDragging = true; state.lastX = x; els.chartContainer.classList.replace('cursor-grab', 'cursor-grabbing'); };
            const handleMove = (x) => { if (!state.isDragging) return; const deltaX = x - state.lastX; state.lastX = x; state.chartOffset -= Math.round(deltaX / 5 * 2); if (state.chartOffset < 0) state.chartOffset = 0; const maxOffset = Math.max(0, state.history.length - 30); if (state.chartOffset > maxOffset) state.chartOffset = maxOffset; drawChart(); if (state.chartOffset > 0) { els.chartStatus.innerText = "과거 기록 조회 중"; els.liveDot.classList.remove('animate-pulse'); els.liveDot.classList.replace('bg-[#3182f6]', 'bg-gray-400'); } else { els.chartStatus.innerText = "실시간"; updateUI(); } };
            const handleEnd = () => { state.isDragging = false; els.chartContainer.classList.replace('cursor-grabbing', 'cursor-grab'); };
            els.chartContainer.addEventListener('mousedown', e => handleStart(e.clientX)); window.addEventListener('mousemove', e => handleMove(e.clientX)); window.addEventListener('mouseup', handleEnd);
            els.chartContainer.addEventListener('touchstart', e => handleStart(e.touches[0].clientX)); window.addEventListener('touchmove', e => handleMove(e.touches[0].clientX)); window.addEventListener('touchend', handleEnd);

            const drawChart = () => {
                if(state.tab !== 'chart') return;
                const { w, h } = size; if(w === 0) { resize(); return; } 
                ctx.clearRect(0, 0, w, h);
                const fullHistory = state.history; const viewCount = 60; 
                let endIdx = fullHistory.length - state.chartOffset; let startIdx = Math.max(0, endIdx - viewCount);
                if (endIdx < viewCount) { endIdx = Math.min(viewCount, fullHistory.length); startIdx = 0; }
                const data = fullHistory.slice(startIdx, endIdx);
                if (data.length < 2) return; 
                let minVal = Math.min(...data); let maxVal = Math.max(...data);
                minVal = Math.min(minVal, state.basePrice); maxVal = Math.max(maxVal, state.basePrice);
                if (maxVal === minVal) { maxVal += 10; minVal -= 10; } else { const padding = (maxVal - minVal) * 0.1; maxVal += padding; minVal -= padding; }
                const range = maxVal - minVal;
                const baseY = h - ((state.basePrice - minVal) / range) * h;
                els.baseLine.style.top = `${(baseY / h) * 100}%`; els.baseLine.classList.remove('hidden');
                const lastVal = data[data.length - 1]; const isUp = lastVal >= state.basePrice; const color = isUp ? '#f04452' : '#3182f6';
                els.labelHigh.style.color = color; els.labelLow.style.color = color; els.liveDot.style.backgroundColor = color;
                ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                const paddingRight = 40; const step = (w - paddingRight) / (viewCount - 1); 
                data.forEach((p, i) => { const x = i * step; const y = h - ((p - minVal) / range) * h; if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
                ctx.stroke();
                ctx.lineTo((data.length - 1) * step, h); ctx.lineTo(0, h); ctx.closePath();
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, isUp ? 'rgba(240, 68, 82, 0.05)' : 'rgba(49, 130, 246, 0.05)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = grad; ctx.fill();
                const maxValData = Math.max(...data); const minValData = Math.min(...data);
                els.valHigh.innerText = Math.round(maxValData); els.valLow.innerText = Math.round(minValData);
                const maxIdx = data.lastIndexOf(maxValData); const minIdx = data.lastIndexOf(minValData);
                const maxPos = { x: maxIdx * step, y: h - ((maxValData - minVal) / range) * h };
                const minPos = { x: minIdx * step, y: h - ((minValData - minVal) / range) * h };
                const labelX_Max = Math.min(Math.max(maxPos.x, 30), w - 30); const labelX_Min = Math.min(Math.max(minPos.x, 30), w - 30);
                els.labelHigh.style.opacity = 1; els.labelHigh.style.left = `${labelX_Max}px`; els.labelHigh.style.top = `${maxPos.y - 25}px`;
                els.labelLow.style.opacity = 1; els.labelLow.style.left = `${labelX_Min}px`; els.labelLow.style.top = `${minPos.y + 10}px`;
                [maxPos, minPos].forEach(pos => { ctx.beginPath(); ctx.fillStyle = 'white'; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
                const lastX = (data.length - 1) * step; const lastY = h - ((lastVal - minVal) / range) * h;
                ctx.beginPath(); ctx.fillStyle = color; ctx.arc(lastX, lastY, 4, 0, Math.PI * 2); ctx.fill();
            };

            const updateUI = () => {
                els.price.innerText = fmt(state.currentPrice); els.diffLabel.innerText = state.basePriceLabel; 
                const diff = state.currentPrice - state.basePrice; 
                const rate = ((diff / state.basePrice) * 100).toFixed(1);
                const sign = diff > 0 ? '+' : ''; const isUp = diff >= 0;
                els.diffVal.innerText = `${sign}${diff}원`; els.rate.innerText = `(${sign}${rate}%)`;
                els.diffBox.className = `flex items-center gap-1 ${isUp ? 'text-up' : 'text-down'}`;
                const now = new Date(); const hours = now.getHours(); const minutes = now.getMinutes(); const currentTimeVal = hours * 60 + minutes; const isMarketOpen = (currentTimeVal >= 480 && currentTimeVal < 1410); 
                if (!isMarketOpen || state.manualPause) {
                    els.marketMsgContainer.classList.remove('hidden'); els.liveDot.classList.remove('animate-pulse'); els.liveDot.classList.replace('bg-[#3182f6]', 'bg-gray-400'); els.chartStatus.innerText = "일시정지됨";
                    if (state.manualPause) els.marketMsgBadge.innerText = "⏸ 장 일시정지됨"; else els.marketMsgBadge.innerText = "🌙 장 마감 (08:00 ~ 23:30)";
                } else {
                    els.marketMsgContainer.classList.add('hidden');
                    if (state.chartOffset === 0) { els.liveDot.classList.add('animate-pulse'); els.liveDot.classList.replace('bg-gray-400', 'bg-[#3182f6]'); els.chartStatus.innerText = "실시간"; }
                }
                if (state.isAdmin && state.adminTrend && state.adminTrendUntil > Date.now()) {
                    const timeLeft = Math.ceil((state.adminTrendUntil - Date.now()) / 1000);
                    if (timeLeft > 0) {
                        const mins = Math.floor(timeLeft / 60); const secs = timeLeft % 60;
                        els.adminTimer.innerText = `${mins}:${secs < 10 ? '0'+secs : secs}`; els.adminTimer.classList.remove('hidden');
                    } else els.adminTimer.classList.add('hidden');
                } else els.adminTimer.classList.add('hidden');
                if(state.tab === 'chart') drawChart(); else if(state.tab === 'order') renderOrderBook();
            };

            els.btnHome.onclick = () => { window.location.href = "https://won429.github.io/enjoysite/"; };
            els.btnProfile.onclick = () => { if (state.isAdmin) showToast("이미 관리자로 로그인되어 있습니다."); else { els.loginModal.classList.remove('hidden'); els.inputPw.value = ''; els.inputPw.focus(); } };
            els.btnLoginCancel.onclick = () => els.loginModal.classList.add('hidden');
            els.btnLoginConfirm.onclick = () => { if (els.inputPw.value === '0920') { state.isAdmin = true; els.loginModal.classList.add('hidden'); els.adminPanel.classList.remove('hidden'); showToast("관리자 모드 실행됨"); } else { showToast("비밀번호가 틀렸습니다."); els.inputPw.value = ''; } };
            els.btnLogout.onclick = () => { state.isAdmin = false; els.adminPanel.classList.add('hidden'); showToast("로그아웃 되었습니다."); };
            const setTrend = async (trend) => { if (!state.isConnected) return; const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'enjoy_ticker'); const duration = 30 * 1000; const now = Date.now(); state.adminTrend = trend; state.adminTrendUntil = now + duration; state.lastUpdated = now; updateUI(); try { await window.updateDoc(docRef, { adminTrend: trend, adminTrendUntil: now + duration, lastUpdated: now }); const label = trend === 'up' ? '상승' : '하락'; showToast(`30초간 ${label} 추세가 적용됩니다.`); } catch (e) { showToast("명령 전송 실패"); } };
            const setManualPause = async (pause) => { if (!state.isConnected) return; const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'stock_data', 'enjoy_ticker'); try { await window.updateDoc(docRef, { manualPause: pause }); showToast(pause ? "장이 일시정지 되었습니다." : "장이 재개되었습니다."); } catch (e) { showToast("명령 전송 실패"); } };
            els.btnAdminUp.onclick = () => setTrend('up'); els.btnAdminDown.onclick = () => setTrend('down'); els.btnMarketResume.onclick = () => setManualPause(false); els.btnMarketPause.onclick = () => setManualPause(true);

            const switchTab = (tabName) => {
                state.tab = tabName;
                [els.tabChart, els.tabOrder, els.tabInfo].forEach(btn => btn.classList.remove('active'));
                if(tabName === 'chart') els.tabChart.classList.add('active'); if(tabName === 'order') els.tabOrder.classList.add('active'); if(tabName === 'info') els.tabInfo.classList.add('active');
                els.viewChart.classList.add('hidden'); els.viewOrder.classList.add('hidden'); els.viewInfo.classList.add('hidden');
                if(tabName === 'chart') { els.viewChart.classList.remove('hidden'); resize(); drawChart(); } else if(tabName === 'order') { els.viewOrder.classList.remove('hidden'); els.viewOrder.classList.add('flex'); renderOrderBook(); } else { els.viewInfo.classList.remove('hidden'); els.viewInfo.classList.add('flex'); }
            };
            els.tabChart.onclick = () => switchTab('chart'); els.tabOrder.onclick = () => switchTab('order'); els.tabInfo.onclick = () => switchTab('info');
        });
    </script>
</body>
</html>
